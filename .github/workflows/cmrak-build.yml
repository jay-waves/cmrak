name: Build and publish cmrak rolling release

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: cmrak-release-rolling
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMRAK_BUILD_COMMIT: ${{ github.sha }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run build:cmrak-assets
      - run: cargo fmt -p cmrak --check
      - run: cargo test --release --locked -p cmrak
      - run: cargo clippy --release --locked -p cmrak --all-targets -- -D warnings
      - run: npm run package:cmrak
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $inputPath = Join-Path $env:RUNNER_TEMP 'cmrak-smoke.md'
          $outputPath = Join-Path $env:RUNNER_TEMP 'cmrak-smoke.html'
          @'
          # Renderer smoke test

          [License](license.md)

          $x^2$

          ```js
          const x = 1;
          ```

          ```mermaid
          flowchart LR
            A --> B
          ```
          '@ | Set-Content -Encoding utf8 $inputPath
          & ./release/cmrak-win32-x64/cmrak.exe $inputPath $outputPath --standalone --root $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $html = Get-Content -Raw $outputPath
          foreach ($marker in @('katex', 'hljs-keyword', '<svg', 'license.md')) {
            if (-not $html.Contains($marker)) { throw "Missing rendered marker: $marker" }
          }
          foreach ($diagram in @("flowchart LR`n A --> B", "sequenceDiagram`n Alice->>Bob: Hello")) {
            $diagramPath = Join-Path $env:RUNNER_TEMP 'cmrak-smoke.mmd'
            $svgPath = Join-Path $env:RUNNER_TEMP 'cmrak-smoke.svg'
            $diagram | Set-Content -Encoding utf8 $diagramPath
            & ./release/cmrak-win32-x64/cmrak.exe svg $diagramPath $svgPath --root $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Get-Content -Raw $svgPath).Contains('<svg')) { throw 'Missing standalone SVG' }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: cmrak-windows-x64
          path: release/cmrak-win32-x64/
          if-no-files-found: error
          retention-days: 90

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run build:cmrak-assets
      - run: cargo fmt -p cmrak --check
      - run: cargo test --release --locked -p cmrak
      - run: cargo clippy --release --locked -p cmrak --all-targets -- -D warnings
      - run: npm run package:cmrak
      - name: Smoke test packaged executable
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/cmrak-smoke.md" <<'EOF'
          # Renderer smoke test

          [License](license.md)

          $x^2$

          ```js
          const x = 1;
          ```

          ```mermaid
          flowchart LR
            A --> B
          ```
          EOF
          ./release/cmrak-linux-x64/cmrak "$RUNNER_TEMP/cmrak-smoke.md" "$RUNNER_TEMP/cmrak-smoke.html" --root "$RUNNER_TEMP"
          for marker in katex hljs-keyword '<svg' license.md; do
            if ! grep -Fq "$marker" "$RUNNER_TEMP/cmrak-smoke.html"; then
              printf 'Missing rendered marker: %s\n' "$marker" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: cmrak-linux-x64
          path: release/cmrak-linux-x64/
          if-no-files-found: error
          retention-days: 90


  release:
    name: Publish rolling release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: cmrak-linux-x64
          path: release-linux
      - uses: actions/download-artifact@v7
        with:
          name: cmrak-windows-x64
          path: release-windows
      - name: Prepare release assets
        run: |
          mkdir release-assets
          cp release-linux/cmrak release-assets/cmrak-linux-x64
          cp release-windows/cmrak.exe release-assets/cmrak-windows-x64.exe
          cp release-linux/LICENSE release-linux/*-LICENSE release-assets/
      - name: Publish current build and remove previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="rolling-$(date -u +%Y%m%d)-${GITHUB_SHA:0:6}"
          printf 'Built from commit %s.\nPackage version: 0.5.0.\n' "$GITHUB_SHA" > release-notes.txt
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "cmrak $tag" --notes-file release-notes.txt
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest --title "cmrak $tag" --notes-file release-notes.txt

          # Keep the previous download available until the new release is complete.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          while IFS= read -r old; do
            if [[ "$old" != "$tag" && ( "$old" == "0.5.0" || "$old" == "rolling" || "$old" =~ ^rolling-[0-9]{8}-[0-9a-f]{6}$ ) ]]; then
              gh release delete "$old" --yes --cleanup-tag
            fi
          done <<< "$releases"
